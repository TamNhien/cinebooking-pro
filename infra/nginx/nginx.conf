events {}

http {
  charset utf-8;
  charset_types text/plain text/css application/json application/javascript application/xml;

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream backend_pool {
    zone backend_pool 64k;
    least_conn;
    server backend-1:8080 resolve;
    server backend-2:8080 resolve;
  }

  upstream frontend_app {
    zone frontend_app 32k;
    server frontend:3000 resolve;
  }

  server {
    listen 80;
    server_name _;

    # V21 baseline browser hardening. Deliberately avoid a strict CSP here because
    # the Next.js app currently uses external poster images and framework scripts.
    # V68: Nginx owns these shared edge headers. Hide identical upstream
    # copies so proxied API responses never become comma-joined duplicates
    # such as "nosniff, nosniff". Backend remains authoritative for CSP
    # and conditional HSTS.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-CineBooking-Browser $http_x_cinebooking_browser;
      proxy_set_header Sec-CH-UA $http_sec_ch_ua;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /uploads/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    location / {
      proxy_pass http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
