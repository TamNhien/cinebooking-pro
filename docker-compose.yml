services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinebooking}
      POSTGRES_USER: ${POSTGRES_USER:-cinebooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinebooking}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinebooking} -d ${POSTGRES_DB:-cinebooking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-1:
    image: cinebooking/backend:${APP_VERSION:-dev}
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VCS_REF: ${VCS_REF:-local}
    volumes:
      - ./uploads:/app/uploads
    environment: &backend_env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cinebooking}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cinebooking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cinebooking}
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required. Run tools/init-env.ps1 first}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cine.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
      PAYMENT_PRODUCTION_GUARD_ENABLED: ${PAYMENT_PRODUCTION_GUARD_ENABLED:-true}
      PAYMENT_WINDOW_SECONDS: ${PAYMENT_WINDOW_SECONDS:-300}
      PAYMENT_AUTO_RECONCILE_ENABLED: ${PAYMENT_AUTO_RECONCILE_ENABLED:-true}
      PAYMENT_RECONCILE_SCAN_MS: ${PAYMENT_RECONCILE_SCAN_MS:-60000}
      PAYMENT_RECONCILE_MIN_AGE_SECONDS: ${PAYMENT_RECONCILE_MIN_AGE_SECONDS:-45}
      PAYMENT_RECONCILE_MAX_BATCH: ${PAYMENT_RECONCILE_MAX_BATCH:-20}
      PAYMENT_RECONCILE_MAX_BACKOFF_SECONDS: ${PAYMENT_RECONCILE_MAX_BACKOFF_SECONDS:-900}
      PAYMENT_WEBHOOK_RECOVERY_ENABLED: ${PAYMENT_WEBHOOK_RECOVERY_ENABLED:-true}
      PAYMENT_WEBHOOK_RECOVERY_SCAN_MS: ${PAYMENT_WEBHOOK_RECOVERY_SCAN_MS:-60000}
      PAYMENT_WEBHOOK_RECOVERY_MIN_AGE_SECONDS: ${PAYMENT_WEBHOOK_RECOVERY_MIN_AGE_SECONDS:-30}
      PAYMENT_WEBHOOK_RECOVERY_MAX_BATCH: ${PAYMENT_WEBHOOK_RECOVERY_MAX_BATCH:-20}
      PAYMENT_WEBHOOK_RECOVERY_MAX_ATTEMPTS: ${PAYMENT_WEBHOOK_RECOVERY_MAX_ATTEMPTS:-5}
      PAYMENT_WEBHOOK_RECOVERY_MAX_BACKOFF_SECONDS: ${PAYMENT_WEBHOOK_RECOVERY_MAX_BACKOFF_SECONDS:-900}
      SEAT_HOLD_TTL_SECONDS: ${SEAT_HOLD_TTL_SECONDS:-300}
      SEAT_HOLD_EXPIRY_SCAN_MS: ${SEAT_HOLD_EXPIRY_SCAN_MS:-5000}
      SEAT_HOLD_EXPIRY_BATCH_SIZE: ${SEAT_HOLD_EXPIRY_BATCH_SIZE:-200}
      SEAT_MAX_PER_BOOKING: ${SEAT_MAX_PER_BOOKING:-8}
      SEAT_PREVENT_SINGLE_GAP: ${SEAT_PREVENT_SINGLE_GAP:-true}
      LOYALTY_POINT_EXPIRY_MONTHS: ${LOYALTY_POINT_EXPIRY_MONTHS:-12}
      LOYALTY_EXPIRING_SOON_DAYS: ${LOYALTY_EXPIRING_SOON_DAYS:-30}
      LOYALTY_EXPIRY_SCAN_MS: ${LOYALTY_EXPIRY_SCAN_MS:-3600000}
      REFUND_FULL_REFUND_MINUTES: ${REFUND_FULL_REFUND_MINUTES:-1440}
      REFUND_PARTIAL_AUTO_MINUTES: ${REFUND_PARTIAL_AUTO_MINUTES:-360}
      REFUND_MINIMUM_MINUTES: ${REFUND_MINIMUM_MINUTES:-120}
      REFUND_PARTIAL_AUTO_RATE: ${REFUND_PARTIAL_AUTO_RATE:-0.80}
      REFUND_MANUAL_RATE: ${REFUND_MANUAL_RATE:-0.50}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost/payment/result}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost/api/payments/vnpay/ipn}
      MOMO_CREATE_URL: ${MOMO_CREATE_URL:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_QUERY_URL: ${MOMO_QUERY_URL:-https://test-payment.momo.vn/v2/gateway/api/query}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost/payment/result}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost/api/payments/momo/ipn}
      DEV_RESET_LINK: ${DEV_RESET_LINK:-false}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-30}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-false}
      MAIL_CONNECTION_TIMEOUT: ${MAIL_CONNECTION_TIMEOUT:-5000}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-5000}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT:-5000}
      MAIL_FROM: ${MAIL_FROM:-no-reply@cinebooking.local}
      STAFF_SHIFT_REMINDER_MINUTES: ${STAFF_SHIFT_REMINDER_MINUTES:-30}
      STAFF_SHIFT_SCAN_MS: ${STAFF_SHIFT_SCAN_MS:-60000}
      SHOWTIME_REMINDER_HOURS: ${SHOWTIME_REMINDER_HOURS:-3}
      SHOWTIME_FINAL_REMINDER_MINUTES: ${SHOWTIME_FINAL_REMINDER_MINUTES:-30}
      SHOWTIME_REMINDER_SCAN_MS: ${SHOWTIME_REMINDER_SCAN_MS:-60000}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:admin@cinebooking.local}
      WEB_PUSH_TTL_SECONDS: ${WEB_PUSH_TTL_SECONDS:-3600}
      FINANCE_AUTO_RECONCILE_ENABLED: ${FINANCE_AUTO_RECONCILE_ENABLED:-true}
      FINANCE_DAILY_CLOSE_CRON: "${FINANCE_DAILY_CLOSE_CRON:-0 10 1 * * *}"
      ANALYTICS_SNAPSHOT_ENABLED: ${ANALYTICS_SNAPSHOT_ENABLED:-true}
      ANALYTICS_SNAPSHOT_SCAN_MS: ${ANALYTICS_SNAPSHOT_SCAN_MS:-900000}
      OBSERVABILITY_SLO_WINDOW_MINUTES: ${OBSERVABILITY_SLO_WINDOW_MINUTES:-5}
      OBSERVABILITY_AVAILABILITY_TARGET_PERCENT: ${OBSERVABILITY_AVAILABILITY_TARGET_PERCENT:-99.9}
      OBSERVABILITY_MAX_ERROR_RATE_PERCENT: ${OBSERVABILITY_MAX_ERROR_RATE_PERCENT:-1.0}
      OBSERVABILITY_P95_LATENCY_TARGET_MS: ${OBSERVABILITY_P95_LATENCY_TARGET_MS:-750}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      CHECKIN_EARLY_MINUTES: ${CHECKIN_EARLY_MINUTES:-2880}
      CHECKIN_LATE_MINUTES: ${CHECKIN_LATE_MINUTES:-240}
      TICKET_PUBLIC_BASE_URL: ${TICKET_PUBLIC_BASE_URL:-}
      TICKET_TRANSFER_CUTOFF_MINUTES: ${TICKET_TRANSFER_CUTOFF_MINUTES:-60}
      TICKET_MAX_TRANSFERS: ${TICKET_MAX_TRANSFERS:-1}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-20}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      SECURITY_STEP_UP_ENABLED: ${SECURITY_STEP_UP_ENABLED:-true}
      SECURITY_STEP_UP_TTL_SECONDS: ${SECURITY_STEP_UP_TTL_SECONDS:-600}
      DR_RPO_TARGET_MINUTES: ${DR_RPO_TARGET_MINUTES:-60}
      DR_RTO_TARGET_MINUTES: ${DR_RTO_TARGET_MINUTES:-15}
      DR_BACKUP_RETENTION_DAYS: ${DR_BACKUP_RETENTION_DAYS:-30}
      DR_DRILL_MAX_AGE_HOURS: ${DR_DRILL_MAX_AGE_HOURS:-168}
      PRIVACY_REQUEST_SLA_HOURS: ${PRIVACY_REQUEST_SLA_HOURS:-72}
      PRIVACY_RETENTION_EXECUTION_ENABLED: ${PRIVACY_RETENTION_EXECUTION_ENABLED:-false}
      KEY_GOVERNANCE_WARNING_DAYS: ${KEY_GOVERNANCE_WARNING_DAYS:-14}
      KEY_GOVERNANCE_AUTO_ROTATION_EXECUTION_ENABLED: ${KEY_GOVERNANCE_AUTO_ROTATION_EXECUTION_ENABLED:-false}
      SUPPLY_CHAIN_EVIDENCE_MAX_AGE_HOURS: ${SUPPLY_CHAIN_EVIDENCE_MAX_AGE_HOURS:-168}
      SUPPLY_CHAIN_MAX_CRITICAL: ${SUPPLY_CHAIN_MAX_CRITICAL:-0}
      SUPPLY_CHAIN_MAX_HIGH: ${SUPPLY_CHAIN_MAX_HIGH:-0}
      SUPPLY_CHAIN_RELEASE_GATE_ENFORCEMENT_ENABLED: ${SUPPLY_CHAIN_RELEASE_GATE_ENFORCEMENT_ENABLED:-false}
      RELIABILITY_AVAILABILITY_TARGET_PERCENT: ${RELIABILITY_AVAILABILITY_TARGET_PERCENT:-99.9}
      RELIABILITY_FAST_WINDOW_MINUTES: ${RELIABILITY_FAST_WINDOW_MINUTES:-5}
      RELIABILITY_SLOW_WINDOW_MINUTES: ${RELIABILITY_SLOW_WINDOW_MINUTES:-60}
      RELIABILITY_FAST_BURN_THRESHOLD: ${RELIABILITY_FAST_BURN_THRESHOLD:-14.4}
      RELIABILITY_SLOW_BURN_THRESHOLD: ${RELIABILITY_SLOW_BURN_THRESHOLD:-6.0}
      RELIABILITY_INCIDENT_LOOKBACK_HOURS: ${RELIABILITY_INCIDENT_LOOKBACK_HOURS:-24}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-cinebooking_refresh}
      STAFF_TIME_ZONE: ${STAFF_TIME_ZONE:-Asia/Ho_Chi_Minh}
      PRICING_TIME_ZONE: ${PRICING_TIME_ZONE:-Asia/Ho_Chi_Minh}
      ATTENDANCE_START_EARLY_MINUTES: ${ATTENDANCE_START_EARLY_MINUTES:-30}
      ATTENDANCE_START_LATE_MINUTES: ${ATTENDANCE_START_LATE_MINUTES:-60}
      STAFF_SCAN_GRACE_MINUTES: ${STAFF_SCAN_GRACE_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-2:
    image: cinebooking/backend:${APP_VERSION:-dev}
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VCS_REF: ${VCS_REF:-local}
    volumes:
      - ./uploads:/app/uploads
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: cinebooking/frontend:${APP_VERSION:-dev}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
        APP_VERSION: ${APP_VERSION:-dev}
        VCS_REF: ${VCS_REF:-local}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
    depends_on:
      - backend-1
      - backend-2

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-1
      - backend-2

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules-v65.yml:/etc/prometheus/rules-v65.yml:ro
    depends_on:
      - backend-1
      - backend-2

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  grafana_data:
