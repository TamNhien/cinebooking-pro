server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: cinebooking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinebooking}
    username: ${SPRING_DATASOURCE_USERNAME:cinebooking}
    password: ${SPRING_DATASOURCE_PASSWORD:cinebooking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  task:
    scheduling:
      pool:
        size: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level trace=%X{traceId:-none} logger=%logger{36} - %msg%n"

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    issuer: cinebooking
    ttl-minutes: ${ACCESS_TOKEN_MINUTES:30}
  auth:
    reset-token-minutes: ${RESET_TOKEN_MINUTES:30}
    dev-reset-link: ${DEV_RESET_LINK:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@cinebooking.local}
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
  seat-hold:
    ttl-seconds: ${SEAT_HOLD_TTL_SECONDS:300}
  seat-selection:
    max-seats: ${SEAT_MAX_PER_BOOKING:8}
    prevent-single-gap: ${SEAT_PREVENT_SINGLE_GAP:true}
  booking:
    payment-window-seconds: ${PAYMENT_WINDOW_SECONDS:300}
  loyalty:
    point-expiry-months: ${LOYALTY_POINT_EXPIRY_MONTHS:12}
    expiring-soon-days: ${LOYALTY_EXPIRING_SOON_DAYS:30}
    expiry-scan-ms: ${LOYALTY_EXPIRY_SCAN_MS:3600000}
  checkin:
    early-minutes: ${CHECKIN_EARLY_MINUTES:2880}
    late-minutes: ${CHECKIN_LATE_MINUTES:240}
  ticket:
    public-base-url: ${TICKET_PUBLIC_BASE_URL:}
    transfer-cutoff-minutes: ${TICKET_TRANSFER_CUTOFF_MINUTES:60}
    max-transfers: ${TICKET_MAX_TRANSFERS:1}
  pricing:
    time-zone: ${PRICING_TIME_ZONE:Asia/Ho_Chi_Minh}
    intelligence:
      enabled: ${PRICING_INTELLIGENCE_ENABLED:true}
      max-discount-percent: ${PRICING_INTELLIGENCE_MAX_DISCOUNT_PERCENT:10}
      max-surcharge-percent: ${PRICING_INTELLIGENCE_MAX_SURCHARGE_PERCENT:25}
  staff:
    time-zone: ${STAFF_TIME_ZONE:Asia/Ho_Chi_Minh}
    attendance-start-early-minutes: ${ATTENDANCE_START_EARLY_MINUTES:30}
    attendance-start-late-minutes: ${ATTENDANCE_START_LATE_MINUTES:60}
    attendance-late-grace-minutes: ${ATTENDANCE_LATE_GRACE_MINUTES:5}
    attendance-early-leave-grace-minutes: ${ATTENDANCE_EARLY_LEAVE_GRACE_MINUTES:5}
    scan-grace-minutes: ${STAFF_SCAN_GRACE_MINUTES:30}
  pwa:
    web-push:
      enabled: ${WEB_PUSH_ENABLED:false}
      vapid-public-key: ${WEB_PUSH_VAPID_PUBLIC_KEY:}
      vapid-private-key: ${WEB_PUSH_VAPID_PRIVATE_KEY:}
      subject: ${WEB_PUSH_SUBJECT:mailto:admin@cinebooking.local}
      ttl-seconds: ${WEB_PUSH_TTL_SECONDS:3600}
  notifications:
    staff-shift-reminder-minutes: ${STAFF_SHIFT_REMINDER_MINUTES:30}
    staff-shift-scan-ms: ${STAFF_SHIFT_SCAN_MS:60000}
    showtime-reminder-hours: ${SHOWTIME_REMINDER_HOURS:3}
    showtime-final-reminder-minutes: ${SHOWTIME_FINAL_REMINDER_MINUTES:30}
    showtime-reminder-scan-ms: ${SHOWTIME_REMINDER_SCAN_MS:60000}
  finance:
    auto-reconcile-enabled: ${FINANCE_AUTO_RECONCILE_ENABLED:true}
    daily-close-cron: "${FINANCE_DAILY_CLOSE_CRON:0 10 1 * * *}"
  analytics:
    snapshot-enabled: ${ANALYTICS_SNAPSHOT_ENABLED:true}
    snapshot-scan-ms: ${ANALYTICS_SNAPSHOT_SCAN_MS:900000}
  observability:
    slo:
      window-minutes: ${OBSERVABILITY_SLO_WINDOW_MINUTES:5}
      availability-target-percent: ${OBSERVABILITY_AVAILABILITY_TARGET_PERCENT:99.9}
      max-error-rate-percent: ${OBSERVABILITY_MAX_ERROR_RATE_PERCENT:1.0}
      p95-latency-target-ms: ${OBSERVABILITY_P95_LATENCY_TARGET_MS:750}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:20}
    login-lock-seconds: ${LOGIN_LOCK_SECONDS:900}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:cinebooking_refresh}
  admin:
    email: ${ADMIN_EMAIL:admin@cine.local}
    password: ${ADMIN_PASSWORD:Admin@123}
    name: ${ADMIN_NAME:System Admin}
  refund:
    full-refund-minutes: ${REFUND_FULL_REFUND_MINUTES:1440}
    partial-auto-minutes: ${REFUND_PARTIAL_AUTO_MINUTES:360}
    minimum-minutes: ${REFUND_MINIMUM_MINUTES:120}
    partial-auto-rate: ${REFUND_PARTIAL_AUTO_RATE:0.80}
    manual-rate: ${REFUND_MANUAL_RATE:0.50}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
    production-guard-enabled: ${PAYMENT_PRODUCTION_GUARD_ENABLED:true}
    reconcile:
      auto-enabled: ${PAYMENT_AUTO_RECONCILE_ENABLED:false}
      scan-ms: ${PAYMENT_RECONCILE_SCAN_MS:60000}
      min-age-seconds: ${PAYMENT_RECONCILE_MIN_AGE_SECONDS:45}
      max-batch: ${PAYMENT_RECONCILE_MAX_BATCH:20}
      max-backoff-seconds: ${PAYMENT_RECONCILE_MAX_BACKOFF_SECONDS:900}
    vnpay:
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/result}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
    momo:
      create-url: ${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
      query-url: ${MOMO_QUERY_URL:https://test-payment.momo.vn/v2/gateway/api/query}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/payment/result}
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}
