name: CineBooking Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release-candidate version label (letters/digits/._- only)"
        required: true
        default: "v64.0.0-rc.1"

permissions:
  contents: read

concurrency:
  group: cinebooking-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Full-stack release-candidate smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_VERSION: ${{ inputs.version }}
      VCS_REF: ${{ github.sha }}
      HTTP_PORT: "18080"
      POSTGRES_PORT: "15433"
      COMPOSE_PROJECT_NAME: cinebooking_v64_rc_${{ github.run_id }}
      JWT_SECRET: v47-rc-test-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release-candidate version
        shell: bash
        run: |
          if [[ ! "$APP_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid version label: $APP_VERSION" >&2
            exit 2
          fi

      - name: Verify V57 source gate
        run: |
          python3 tools/verify_v43_staff_operations.py
          python3 tools/verify_v43_analytics_excel_detail.py
          python3 tools/verify_v43_analytics_csv_detail.py
          python3 tools/verify_v44_maintenance_reliability.py
          python3 tools/verify_v45_customer_support.py
          python3 tools/verify_v46_security_account_protection.py
          python3 tools/verify_seed_demo_49.py
          python3 tools/verify_v47_payment_gateway_operations.py
          python3 tools/verify_v48_concession_inventory_2.py
          python3 tools/verify_seed_demo_52.py
          python3 tools/verify_v49_smart_showtime_planning_2.py
          python3 tools/verify_seed_demo_53.py
          python3 tools/verify_v50_recommendation_intelligence_2.py
          python3 tools/verify_seed_demo_54.py
          python3 tools/verify_v51_analytics_forecasting_3.py
          python3 tools/verify_v51_utf8_real_data.py
          python3 tools/verify_seed_demo_56.py
          python3 tools/verify_v52_pwa_mobile_3.py
          python3 tools/verify_seed_demo_57.py
          python3 tools/verify_realistic_data_57.py
          python3 tools/verify_v53_operations_command_center.py
          python3 tools/verify_v54_performance_benchmarking.py
          python3 tools/verify_v55_customer_retention.py
          python3 tools/verify_v56_customer_value_rfm.py
          python3 tools/verify_v57_booking_seat_intelligence.py

      - name: Verify V58 source gate
        run: python3 tools/verify_v58_operations_control_center.py

      - name: Verify V59 source gate
        run: python3 tools/verify_v59_realtime_operations_4.py

      - name: Verify V60 source gate
        run: python3 tools/verify_v60_payment_production_4.py

      - name: Verify V61 source gate
        run: python3 tools/verify_v61_fraud_risk_intelligence.py

      - name: Verify V62 source gate
        run: python3 tools/verify_v62_dynamic_pricing_4.py

      - name: Verify V63 source gate
        run: python3 tools/verify_v63_recommendation_4.py

      - name: Verify V64 source gate
        run: python3 tools/verify_v64_crm_marketing_automation.py

      - name: Docker diagnostics
        run: |
          docker version
          docker compose version

      - name: Run full-stack V29 smoke test
        run: bash tools/smoke-v29.sh

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E journeys (V29.2 + V30 + V31.2 + V33 + V34 + V36 + V37 + V38 + V39 + V40 + V41 + V42 + V43 + V44 + V45 + V46 + V47 + V48 + V49 + V50 + V51 + V52 + V53 + V54 + V55 + V56 + V57 + V58 + V59 + V60 + V61 + V62 + V63 + V64)
        env:
          E2E_SKIP_BUILD: "true"
        run: bash tools/e2e-v29.2.sh

      - name: Upload Playwright E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinebooking-${{ inputs.version }}-playwright-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate release-candidate manifest
        if: success()
        shell: bash
        run: |
          backend_id="$(docker image inspect "cinebooking/backend:${APP_VERSION}" --format '{{.Id}}')"
          frontend_id="$(docker image inspect "cinebooking/frontend:${APP_VERSION}" --format '{{.Id}}')"
          BACKEND_ID="$backend_id" FRONTEND_ID="$frontend_id" python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              "schema": "cinebooking-v29-release-candidate/v1",
              "version": os.environ["APP_VERSION"],
              "revision": os.environ["VCS_REF"],
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "images": {
                  "backend": {"tag": f"cinebooking/backend:{os.environ['APP_VERSION']}", "id": os.environ["BACKEND_ID"]},
                  "frontend": {"tag": f"cinebooking/frontend:{os.environ['APP_VERSION']}", "id": os.environ["FRONTEND_ID"]},
              },
              "published": False,
              "deployed": False,
          }
          Path("release-candidate-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload release-candidate manifest
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cinebooking-${{ inputs.version }}-release-candidate-manifest
          path: release-candidate-manifest.json
          if-no-files-found: error
          retention-days: 14
