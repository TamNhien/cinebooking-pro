name: CineBooking CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinebooking-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  JWT_SECRET: "v28-ci-compose-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ"

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        run: mvn -B -ntp test

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  backend-integration:
    name: Backend Testcontainers integration
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Docker diagnostics
        run: |
          docker version
          docker info

      - name: Run integration tests with PostgreSQL and Redis Testcontainers
        run: mvn -B -ntp verify -Pci-integration

      - name: Upload integration-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-reports
          path: |
            backend/target/failsafe-reports/
            backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cinebooking-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Lint frontend (legacy baseline)
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Package standalone frontend artifact
        run: tar -czf cinebooking-frontend-standalone.tgz .next/standalone .next/static public

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: cinebooking-frontend-standalone
          path: frontend/cinebooking-frontend-standalone.tgz
          if-no-files-found: error
          retention-days: 7

  source-regression:
    name: V26-V28 source regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify PWA source
        run: bash tools/verify-v26-source.sh

      - name: Verify JWT hardening
        run: python3 tools/verify_v26_1_security.py

      - name: Verify manifest runtime patch
        run: python3 tools/verify_v26_2_manifest.py

      - name: Verify service-worker diagnostic patch
        run: python3 tools/verify_v26_3_sw_diagnostic.py

      - name: Verify V27 database safety
        run: python3 tools/verify_v27_data_safety.py

      - name: Verify V27.1 runtime compatibility
        run: python3 tools/verify_v27_1_runtime_compat.py

      - name: Verify V27.2 restore probe
        run: python3 tools/verify_v27_2_restore_probe.py

      - name: Verify V28 CI structure
        run: python3 tools/verify_v28_ci.py

      - name: Verify V28.8 Testcontainers storage isolation
        run: python3 tools/verify_v28_8_test_storage.py

      - name: Verify V29 release-candidate readiness
        run: python3 tools/verify_v29_release_candidate.py

      - name: Verify V29.1 checkout compatibility
        run: python3 tools/verify_v29_1_checkout_compat.py

      - name: Verify V29.2 Playwright E2E structure
        run: python3 tools/verify_v29_2_playwright_e2e.py

      - name: Verify V29.3 demo catalog and September schedule
        run: python3 tools/verify_v29_3_demo_schedule.py

      - name: Verify V30 discovery and showtime calendar
        run: python3 tools/verify_v30_discovery_showtimes.py

      - name: Verify V30.1 frontend toolchain guard
        run: python3 tools/verify_v30_1_frontend_toolchain.py

      - name: Verify V30.2 Playwright pin policy
        run: python3 tools/verify_v30_2_playwright_pin_policy.py

      - name: Verify V31 ticket wallet and calendar
        run: python3 tools/verify_v31_ticket_wallet.py

      - name: Verify V31.1 ticket-wallet lint purity
        run: python3 tools/verify_v31_1_lint_purity.py

  compose-config:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

  docker-build:
    name: Docker image build validation
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend, source-regression, compose-config]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: cinebooking/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: cinebooking/frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
