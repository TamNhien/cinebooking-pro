name: CineBooking CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinebooking-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  JWT_SECRET: "v28-ci-compose-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ"

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        run: mvn -B -ntp test

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  backend-integration:
    name: Backend Testcontainers integration
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Docker diagnostics
        run: |
          docker version
          docker info

      - name: Run integration tests with PostgreSQL and Redis Testcontainers
        run: mvn -B -ntp verify -Pci-integration

      - name: Upload integration-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-reports
          path: |
            backend/target/failsafe-reports/
            backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cinebooking-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Audit frontend dependencies (high/critical gate)
        run: npm audit --audit-level=high

      - name: Lint frontend (legacy baseline)
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Package standalone frontend artifact
        run: tar -czf cinebooking-frontend-standalone.tgz .next/standalone .next/static public

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: cinebooking-frontend-standalone
          path: frontend/cinebooking-frontend-standalone.tgz
          if-no-files-found: error
          retention-days: 7

  source-regression:
    name: V26-V77 source regression
