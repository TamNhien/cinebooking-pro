version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # V30.1: keep the lint/typecheck toolchain on validated majors.
    # ESLint 10 is not yet compatible with the React plugin stack used by
    # eslint-config-next 16.3, and TypeScript 7 is not yet supported by
    # typescript-eslint. Minor/patch updates on the current majors remain open.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # V30.2: keep browser/runtime coupling on the validated Playwright 1.60 line.
      # Patch releases are allowed; minor/major upgrades require an explicit review.
      - dependency-name: "@playwright/test"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
